<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
    <!-- 首帧兜底：tokens.css 打进 bundle 的 CSS 到位之前，html 先按主题染画布色，
         避免深色用户在覆盖层/首帧之间看到白底。主题键 = useTheme.ts 的 `ff-theme`。
         ⚠️ 画布色/主题键共 5 个落点，改要一起改：useTheme.ts · tokens.css ·
         preload/index.ts · 这里（脚本+style） · main/index.ts 的 backgroundColor。 -->
    <script>
      try {
        var t = localStorage.getItem('ff-theme')
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <style>
      html { background: #0e0e0e; }
      html[data-theme='light'] { background: #f1f2f3; }
    </style>
    <!-- 字体：西文 Geist + 中文 MiSans VF，都是**可变字体**（见 tokens.css 的 `--ff-font`）。
         ⚠️ 路径必须相对（`./fonts/`）：打包版走 `file://`，绝对路径 `/fonts/` 会解析到盘根而丢字。
         ⚠️ 这两个 CSS 在 `public/` 里，Vite **原样复制不处理** ⇒ 里面的 `url()` 也必须是相对自身的路径。 -->
    <link rel="stylesheet" href="./fonts/geist.css" />
    <link rel="stylesheet" href="./fonts/misans.css" />
    <!-- ⚠️ 窗口标题由这里决定，不是 main/index.ts 里那个 `title`：
         页面一旦加载完成，Electron 就把窗口标题跟着 `<title>` 走。
         改成别的值时**两处要一起改**（见 electron/main/index.ts 的注释）。 -->
    <title>File Finder</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

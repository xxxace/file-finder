<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<!-- 真naive-ui 编译出来的 CSS（`header-width` 探针已验过它是真的） -->
<link rel="stylesheet" href="../header-width/css-real.generated.css">
<style>
    /* ⚠️ `.image-box-item` 与 `.file-item` 的**等效复制**（index.vue 里那两段） */
    .image-box {
        display: flex; flex-flow: row wrap;
        overflow: hidden auto;
        justify-content: flex-start; align-content: flex-start;
        margin-left: -5px; margin-right: -5px;
        width: 1400px;
    }
    .image-box-item, .file-item {
        --item-gap: 10px;
        --item-width: calc(100% / 4);
        --item-height: 200px;
        display: flex; flex-direction: column;
        flex-grow: 0; flex-shrink: 0;
        width: calc(var(--item-width) - var(--item-gap));
        min-height: 80px !important;
        height: var(--item-height) !important;
        max-height: var(--item-height) !important;
        padding: 0 2px 10px;
        margin: 10px 5px 0px;
        border: 1px solid transparent;
        justify-content: flex-end; align-items: center;
        box-sizing: border-box; position: relative;
        background: #dfe3ea;
        transition: border-color .1s ease-in-out, box-shadow .1s ease-in-out,
            background-color .1s ease-in-out, transform .18s cubic-bezier(.2,.9,.3,1.1);
    }
    .image-box-item span, .file-item span {
        display: inline-block; width: 100%; height: 38px !important;
        line-height: 1em; font-size: 1em; color: #000; font-weight: bold;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center;
    }

    /* ★ 网格焦点（index.vue 的 `.image-box-item.cursor`） */
    .image-box-item.cursor {
        border-color: #2080f0;
        background-color: rgba(110,123,173,.16);
        box-shadow: 1px 0 10px rgba(122,141,169,.15);
        transform: scale(1.012);
        z-index: 1;
    }
    /* ★ 预览层那一格（index.vue 的 `.file-item.file-cursor`）
       ⚠️ 2026-10-04 已从「2px黑 + 4px蓝双环」改成与网格同一套 1px 细框 */
    .file-item {
        width: 180px !important; height: 180px !important; max-height: 180px !important;
    }
    .file-item.file-cursor {
        border-color: #2080f0;
        background-color: rgba(110,123,173,.16);
        box-shadow: 1px 0 10px rgba(122,141,169,.15);
    }
</style>
</head>
<body>
<div class="image-box" id="grid"></div>
<div class="image-box" id="files" style="margin-top:24px"></div>
<script src="../../../node_modules/vue/dist/vue.global.prod.js"></script>
<script src="../../../node_modules/naive-ui/dist/index.js"></script>
<script>
window.__build = function (which, cls) {
    const box = document.getElementById(which);
    box.innerHTML = '';
    for (let i = 0; i < 4; i++) {
        const d = document.createElement('div');
        d.className = (which === 'grid' ? 'image-box-item' : 'file-item') + (i === 1 ? ' ' + cls : '');
        d.dataset.key = 'k' + i;
        const ph = document.createElement('div');
        ph.style.cssText = 'width:100%;height:calc(100% - 36px);background:#b9c0cc';
        d.appendChild(ph);
        d.appendChild(document.createTextNode('[TST-5…]'));
        box.appendChild(d);
    }
    return true;
};

/**
 * 量"焦点环到底有多粗" —— **用像素数，不靠看**。
 *
 * 手法：从元素中心往**左**扫一行像素，找"颜色明显不同于卡片底色"的连续段
 * ⇒ 那就是左侧可见环的总厚度（含 border + box-shadow 扩散）。
 * 上下左右都量，取最大值（最粗的那边）。
 */
window.__ringThickness = function (which, key) {
    const el = document.querySelector('#' + which + ' [data-key="' + key + '"]');
    if (!el) return { err: 'no el#' + which + '[data-key=' + key + ']' };
    const cs = getComputedStyle(el);
    const bw = parseFloat(cs.borderLeftWidth) || 0;
    // box-shadow 的 spread：从每一段 "0px 0px 0px Npx" 里抠出最大的 N
    let spread = 0;
    const re = /rgba?\([^)]*\)\s*(-?[\d.]+)px\s+(-?[\d.]+)px\s+(-?[\d.]+)px\s+(-?[\d.]+)px/g;
    let m;
    while ((m = re.exec(cs.boxShadow)) !== null) {
        // 只有 blur=0、offset=0 的那一段才是"实心环"，它的第 4 个数是 spread
        if (parseFloat(m[1]) === 0 && parseFloat(m[2]) === 0 && parseFloat(m[3]) === 0) {
            spread = Math.max(spread, parseFloat(m[4]));
        }
    }
    return {
        borderWidth: bw,
        boxShadow: cs.boxShadow,
        spread,
        transform: cs.transform,
        approxTotal: bw + spread,
    };
};

window.__ready = true;
</script>
</body>
</html>

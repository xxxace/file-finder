<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <title>头部行数 / 折叠 / 截断 —— 真布局测量</title>
    <style>
        html,
        body {
            margin: 0;
            background: #eef0f4;
            font-family: system-ui, "Microsoft YaHei", sans-serif;
        }

        #stage {
            padding: 10px;
            box-sizing: border-box;
        }

        .width-tag {
            font-size: 12px;
            color: #666;
            padding: 2px 4px 6px;
        }

        /* 与 src/views/FileFinder/index.vue 的 .file-finder 一致 */
        .file-finder {
            display: flex;
            flex-flow: column;
            box-sizing: border-box;
        }

        /* ===================== 变体 new（候选实现） ===================== */
        .v-new .header-bar {
            display: flex;
            /* 「头部永远只有一行」的第一道保险 */
            flex-wrap: nowrap;
            padding: 4px;
            margin-bottom: 4px;
            border-radius: 4px;
            box-shadow: 1px 0 6px rgba(113, 147, 192, 0.25);
            justify-content: space-between;
        }

        .v-new .header-bar .n-input {
            width: 200px;
        }

        /* 导航区：头部唯一的弹性槽位。min-width:0 是地基（默认 auto ≈ 内容宽 ⇒ 不会收窄） */
        .v-new .nav-zone {
            flex: 1 1 auto;
            min-width: 0;
            max-width: 50%;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }

        .v-new .crumb {
            /* ⚠️ `0 1 auto`（**可收缩**）而不是 `0 0 auto`：
               宽度不够时先压历史段，而不是把"当前层"直接挤出屏幕右边缘被裁掉。
               收缩下界交给 `min-width: 0` + 文本省略号 —— 极窄时显示成「…」，与资源管理器一致。 */
            flex: 0 1 auto;
            min-width: 0;
            max-width: 160px;
            cursor: pointer;
        }

        /* 当前层**永不被压掉**：它是"我在哪"的唯一答案，比任何历史段都重要 */
        .v-new .crumb-current {
            flex: 0 0 auto;
        }

        .v-new .fs-tag {
            max-width: 220px;
        }

        .v-new .crumb .n-tag__content {
            min-width: 0;
            overflow: hidden;
        }

        .v-new .crumb .crumb-text {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .v-new .crumb-more {
            padding: 0 8px;
        }

        .v-new .crumb-root,
        .v-new .crumb-current {
            cursor: default;
        }

        .v-new .toolbar {
            flex: 0 0 auto;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 12px;
        }

        /* ===================== 变体 old（改造前的写法，作对照） =====================
           与改造前的 index.vue 一致：左区 `.hstack` 是 flex-wrap:wrap，
           面包屑无 max-width、无折叠、无省略；工具条 align-self:flex-end。 */
        .v-old .header-bar {
            display: flex;
            padding: 4px;
            margin-bottom: 4px;
            border-radius: 4px;
            box-shadow: 1px 0 6px rgba(113, 147, 192, 0.25);
            justify-content: space-between;
        }

        .v-old .header-bar .n-input {
            width: 200px;
        }

        .v-old .hstack {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .v-old .toolbar {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 12px;
            align-self: flex-end;
        }
    </style>
</head>

<body>
    <div id="stage"></div>

    <script src="../../../node_modules/vue/dist/vue.global.prod.js"></script>
    <script src="../../../node_modules/naive-ui/dist/index.js"></script>
    <script>
        const { createApp, h, ref } = Vue;
        const N = naive;

        /**
         * 故意造一条"层级多 + 名字长"的链：
         * 首段 = 盘符（不可点），后面 7 层，其中两层的名字很长（测单条截断）。
         * 全部是**假数据**，不碰任何盘。
         */
        const SEGS = [
            { name: 'E:', kind: 'root' },
            { name: 'videos', kind: 'dir' },
            { name: '示例演员A的名字真的很长很长', kind: 'dir' },
            { name: '示例作品标题B也很难短下来', kind: 'dir' },
            { name: '子目录C', kind: 'dir' },
            { name: '第四层目录', kind: 'dir' },
            // ⚠️ 最后两段（折叠后它们就是"父 + 当前"，**一定会被渲染**）故意起长名字：
            // 只有这样才测得到"单条截断"。上一版把长名字放在会被折掉的中间层，
            // 结果截断数恒为 0 —— 探针测了个寂寞。
            { name: '第五层是一个特别长的目录名字', kind: 'dir' },
            { name: '当前层也是一个特别长的目录名字', kind: 'dir' },
        ];

        /** 折叠：保首段 + `…` + 末 2 段（与 src/utils 的 foldCrumbList 同规则：`…` 至少代表 2 段） */
        const fold = (segs) => {
            if (segs.length <= 4) return null;
            const head = segs[0];
            const tail = segs.slice(-2);
            const hidden = segs.slice(1, segs.length - 2);
            return hidden.length < 2 ? null : { head, hidden, tail };
        };

        const variant = ref('new');
        window.__setVariant = (v) => { variant.value = v; };
        window.__segCount = SEGS.length;

        const crumbTag = (seg, cls, spin) => h(N.NTag, {
            class: ['crumb', cls].filter(Boolean).join(' '),
            title: seg.name,
            style: 'cursor:pointer',
        }, {
            default: () => [
                h('span', { class: 'crumb-text' }, seg.name),
                spin ? h(N.NSpin, { size: 12, style: 'margin-left:8px' }) : null,
            ],
        });

        const chip = (bounded) => h(N.NTag, {
            class: bounded ? 'fs-tag' : '',
            title: 'E:/videos/示例演员A的名字真的很长很长/示例作品标题B也很难短下来',
        }, {
            avatar: () => h(N.NAvatar, { color: 'transparent' }, { default: () => '📁' }),
            // 有界版走的是 foldPath 的结果（首段 + … + 末2）；无界版就是原样的整条路径
            default: () => bounded
                ? 'E:/…/示例作品标题B也很难短下来'
                : 'E:/videos/示例演员A的名字真的很长很长/示例作品标题B也很难短下来',
        });

        const toolbar = () => h('div', { class: 'toolbar' }, [
            h(N.NButton, { size: 'small' }, { default: () => '补全这一片' }),
            h(N.NButton, { size: 'small' }, { default: () => '重读这一片' }),
            h(N.NButton, { size: 'small' }, { default: () => '补封面' }),
            h(N.NButton, { size: 'small' }, { default: () => '◉' }),
            h(N.NBadge, { value: 35 }),
            h(N.NInput, { size: 'small', placeholder: '搜索', style: 'width:200px' }),
            h(N.NButton, { size: 'small' }, { default: () => '↻' }),
        ]);

        const App = {
            setup() {
                return () => {
                    const isNew = variant.value === 'new';
                    const f = isNew ? fold(SEGS) : null;

                    const nav = isNew
                        ? h('div', { class: 'nav-zone' }, [
                            chip(true),
                            f
                                ? [
                                    crumbTag(f.head, 'crumb-root', false),
                                    crumbTag({ name: '…' }, 'crumb-more', false),
                                    ...f.tail.map((s, i) =>
                                        crumbTag(s, 'crumb' + (i === f.tail.length - 1 ? ' crumb-current' : ''),
                                            i === f.tail.length - 1)),
                                ]
                                : SEGS.map((s, i) =>
                                    crumbTag(s,
                                        (s.kind === 'root' ? 'crumb-root ' : '') +
                                        (i === SEGS.length - 1 ? 'crumb-current' : ''),
                                        false)),
                            h(N.NButton, { size: 'small' }, { default: () => '返回' }),
                        ])
                        : h('div', { class: 'hstack' }, [
                            chip(false),
                            ...SEGS.map((s) => crumbTag(s, '', false)),
                            h(N.NButton, { size: 'small' }, { default: () => '返回' }),
                        ]);

                    return h('div', {
                        class: 'file-finder header-bar ' + (isNew ? 'v-new' : 'v-old'),
                        // 上面把 header-bar 直接挂在 file-finder 上：探针只测这一条，
                        // 不用复刻整个页面骨架
                    }, [nav, toolbar()]);
                };
            },
        };

        createApp(App).mount('#stage');

        /**
         * 视觉行数 = 把所有子孙元素的"顶边"按**容差 10px** 聚类后的簇数。
         *
         * ⚠️ 不能用"直接子元素的顶边去重"：`align-items: center` 下同一行里
         * 高度不同的元素顶边本来就不同（chip 比按钮高），那种量法恒为 2 行 —— 上一版就是错的。
         */
        const rowsOf = (el) => {
            const tops = [...el.querySelectorAll('*')]
                .filter(n => n.getBoundingClientRect().height > 0)
                .map(n => Math.round(n.getBoundingClientRect().top))
                .sort((a, b) => a - b);
            let rows = 0;
            let last = -Infinity;
            for (const t of tops) {
                if (t - last > 10) { rows += 1; last = t; }
            }
            return rows;
        };

        window.__measure = function (v, width) {
            const header = document.querySelector('.file-finder.header-bar');
            const box = header.getBoundingClientRect();
            const crumbs = [...header.querySelectorAll('.crumb')];
            const cur = header.querySelector('.crumb-current');
            const curBox = cur ? cur.getBoundingClientRect() : null;
            const toolbar = header.querySelector('.toolbar');
            const tbBox = toolbar.getBoundingClientRect();

            // 单条截断是否真的发生：文本层 scrollWidth > clientWidth
            const ellipsised = crumbs
                .map(c => c.querySelector('.crumb-text'))
                .filter(Boolean)
                .filter(t => t.scrollWidth > t.clientWidth + 1).length;

            return {
                变体: v,
                窗口宽: width,
                头部高: Math.round(box.height),
                '顶边簇数(仅参考)': rowsOf(header),
                渲染出的段数: crumbs.length,
                有截断的段数: ellipsised,
                当前段可见: curBox ? (curBox.width > 0 && Math.round(curBox.right) <= Math.round(box.right) + 1) : null,
                当前段右边距: curBox ? Math.round(box.right - curBox.right) : null,
                工具条未溢出: Math.round(tbBox.right) <= Math.round(box.right) + 1,
                导航区宽: Math.round((header.querySelector('.nav-zone') || header.querySelector('.hstack')).getBoundingClientRect().width),
                头部宽: Math.round(box.width),
            };
        };

        window.__probeAll = async function () {
            const out = [];
            const stage = document.getElementById('stage');
            const widths = [640, 800, 1280, 1920];
            for (const v of ['old', 'new']) {
                for (const w of widths) {
                    window.__setVariant(v);
                    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
                    stage.style.width = w + 'px';
                    await new Promise(r => setTimeout(r, 80));
                    out.push(window.__measure(v, w));
                }
            }
            return out;
        };
    </script>
</body>

</html>

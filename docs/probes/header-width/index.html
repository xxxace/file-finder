<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <title>头部行数 / 折叠 / 截断 —— 真布局 + 真 scoped CSS</title>

    <!-- ⚠️ 这份是**真实编译产物**（两个 SFC 的 <style scoped>，less + scoped 转换），
         由 build-css.mjs 生成、run.sh 会先重建。
         `new` 变体**只**用它，不再手抄 —— 手抄只能证明"这套写法在普通 CSS 下成立"，
         证明不了":deep() / :not()::before 在 scoped 转换之后还成立"。 -->
    <link rel="stylesheet" href="css-real.generated.css">

    <style>
        html,
        body {
            margin: 0;
            background: #eef0f4;
            font-family: system-ui, "Microsoft YaHei", sans-serif;
        }

        #stage {
            padding: 10px;
            box-sizing: border-box;
        }

        /* ===================== 变体 old 的复刻样式 =====================
           ⚠️ 这一段是**手写的"改造前"样式复刻**（不是从 git 里抽出来的），
           只用来做对照：证明"旧写法下头部高度确实随窗口变化"。
           它**不带** data-v-probe，所以真实 scoped CSS 对 old 变体完全不参与。 */
        .old-header {
            display: flex;
            padding: 4px;
            margin-bottom: 4px;
            border-radius: 4px;
            box-shadow: 1px 0 6px rgba(113, 147, 192, 0.25);
            justify-content: space-between;
        }

        .old-header .n-input {
            width: 200px;
        }

        .old-header .hstack {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .old-header .toolbar {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 12px;
            align-self: flex-end;
        }
    </style>
</head>

<body>
    <div id="stage"></div>

    <script src="../../../node_modules/vue/dist/vue.global.prod.js"></script>
    <script src="../../../node_modules/naive-ui/dist/index.js"></script>
    <script>
        const { createApp, h, ref } = Vue;
        const N = naive;

        /** 真实 scoped CSS 要求的选择器属性（与 build-css.mjs 的 SCOPE_ID 一致） */
        const SCOPE_ATTR = 'data-v-probe';

        /**
         * 故意造一条"层级多 + 名字长"的链：首段 = 盘符（不可点），后 7 层，
         * 其中最后两层名字很长（折叠后它们一定会被渲染，才测得到"单条截断"）。
         * 全部是**假数据**，不碰任何盘。
         */
        const SEGS = [
            { name: 'E:', kind: 'root' },
            { name: 'videos', kind: 'dir' },
            { name: '示例演员A的名字真的很长很长', kind: 'dir' },
            { name: '示例作品标题B也很难短下来', kind: 'dir' },
            { name: '子目录C', kind: 'dir' },
            { name: '第四层目录', kind: 'dir' },
            { name: '第五层是一个特别长的目录名字', kind: 'dir' },
            { name: '当前层也是一个特别长的目录名字', kind: 'dir' },
        ];

        /** 折叠：保首段 + `…` + 末 2 段（与 src/utils 的 foldCrumbList 同规则） */
        const fold = (segs) => {
            if (segs.length <= 4) return null;
            const head = segs[0];
            const tail = segs.slice(-2);
            const hidden = segs.slice(1, segs.length - 2);
            return hidden.length < 2 ? null : { head, hidden, tail };
        };

        const variant = ref('new');
        window.__setVariant = (v) => { variant.value = v; };
        window.__scopeAttr = SCOPE_ATTR;

        /**
         * 只有 `new` 变体打 scoped 标记 ⇒ 真实 scoped CSS 只对它生效。
         * old 变体全靠上面那段手写复刻，两种样式不会互相污染。
         */
        const sv = () => (variant.value === 'new' ? { [SCOPE_ATTR]: '' } : {});

        const crumbTag = (seg, cls, spin) => h(N.NTag, {
            class: ['crumb', cls].filter(Boolean).join(' '),
            title: seg.name,
            ...sv(),
        }, {
            default: () => [
                h('span', { class: 'crumb-text', ...sv() }, seg.name),
                spin ? h(N.NSpin, { size: 12, style: 'margin-left:8px' }) : null,
            ],
        });

        /**
         * 根 chip 的三种形态。
         * ⚠️ 关键场景：**冷启动 → 从「缓存记录」跳进来**（那时 `dir` 还是空的）
         * ⇒ 根 chip 是"还没选根"那个按钮，而面包屑**同时存在** ⇒ 两者真的抢地方。
         * 这个场景下"按钮 vs 图标"的差别才是实打实的（在"已选根"的场景里没有按钮，差别为 0）。
         */
        const chipForm = ref('path');
        window.__setChipForm = (v) => { chipForm.value = v; };

        /** 与 FolderSelector 的模板结构一致：n-tag > div.fs-path > span.fs-text + tiny button */
        const chip = (bounded) => {
            const form = chipForm.value;
            if (form === 'label') {
                return h(N.NButton, { size: 'small', ...sv() }, { default: () => '请选择文件夹(D)' });
            }
            if (form === 'icon') {
                return h(N.NButton, { size: 'small', ...sv() }, {
                    // 真实实现是一个 14×14 的 <img>；这里用同尺寸的块替身（量盒子，不量图）
                    icon: () => h('span', {
                        style: 'display:block;width:14px;height:14px;background:#888;border-radius:2px',
                    }),
                });
            }
            return h(N.NTag, {
                class: 'fs-tag',
                title: 'E:/videos/…（这是你的起点；点 × 可清除）',
                ...sv(),
            }, {
                avatar: () => h(N.NAvatar, { color: 'transparent' }, { default: () => '·' }),
                // 有界版给的是 foldPath 的结果（首段 + … + 末2）；无界版是原样的整条路径
                default: () => h('div', { class: 'fs-path', ...sv() }, [
                    h('span', { class: 'fs-text', ...sv() }, bounded
                        ? 'E:/…/示例作品标题B也很难短下来'
                        : 'E:/videos/示例演员A的名字真的很长很长/示例作品标题B也很难短下来'),
                    h(N.NButton, { size: 'tiny', style: 'margin-left:6px' }, { default: () => 'x' }),
                ]),
            });
        };

        /**
         * 工具条的候选形态。用来量「缩文案 / 收下拉 / 挪 badge」各自能还给导航区多少 px ——
         * 这种事**不能估**：字宽取决于字体与 padding，猜出来的数字会误导决策。
         */
        const TB_MODES = ['now', 'short', 'short2', 'more'];
        const tbMode = ref('now');
        window.__setToolbar = (v) => { tbMode.value = v; };

        const toolbar = (isNew) => {
            const m = tbMode.value;
            const kids = [];

            if (m === 'more') {
                // 与真实实现一致：**图标 + 文字**（只算文字会低估 ~16px）
                kids.push(h(N.NButton, { size: 'small' }, {
                    icon: () => h(N.NIcon, null, { default: () => '⌄' }),
                    default: () => '更多',
                }));
            } else {
                const short = m !== 'now';
                kids.push(h(N.NButton, { size: 'small' }, { default: () => (short ? '补全' : '补全这一片') }));
                kids.push(h(N.NButton, { size: 'small' }, { default: () => (short ? '重读' : '重读这一片') }));
                kids.push(h(N.NButton, { size: 'small' }, { default: () => (short ? '封面' : '补封面') }));
            }

            kids.push(h(N.NButton, { size: 'small' }, { default: () => '◉' }));

            // short2 = 把角标挪出工具条（它是"内容统计"，本来就不该住在动作区）
            if (m !== 'short2') kids.push(h(N.NBadge, { value: 35 }));

            kids.push(h(N.NInput, {
                size: 'small', placeholder: '搜索',
                // ⚠️ 必须带 scoped 属性，否则真实 CSS 里的 `width: 200px` 不生效 ——
                // 探针第一版就漏了它，把输入框量成 175px（少 25px），整张预算表都偏小。
                ...sv(),
                ...(m === 'short2' ? { style: 'width:150px' } : {}),
            }));
            kids.push(h(N.NButton, { size: 'small' }, { default: () => '↻' }));

            return h('div', { class: 'toolbar', ...sv() }, kids);
        };

        const App = {
            setup() {
                return () => {
                    const isNew = variant.value === 'new';
                    const f = isNew ? fold(SEGS) : null;

                    const nav = isNew
                        ? h('div', { class: 'nav-zone', ...sv() }, [
                            chip(true),
                            f
                                ? [
                                    crumbTag(f.head, 'crumb-root', false),
                                    crumbTag({ name: '…' }, 'crumb-more', false),
                                    ...f.tail.map((s, i) =>
                                        crumbTag(s, i === f.tail.length - 1 ? 'crumb-current' : '',
                                            i === f.tail.length - 1)),
                                ]
                                : SEGS.map((s) => crumbTag(s, s.kind === 'root' ? 'crumb-root' : '', false)),
                            h(N.NButton, { size: 'small' }, { default: () => '返回' }),
                        ])
                        : h('div', { class: 'hstack' }, [
                            chip(false),
                            ...SEGS.map((s) => crumbTag(s, '', false)),
                            h(N.NButton, { size: 'small' }, { default: () => '返回' }),
                        ]);

                    return h('div', { class: 'file-finder', ...sv() }, [
                        h('div', { class: 'header-bar' + (isNew ? '' : ' old-header'), ...sv() }, [
                            nav,
                            toolbar(isNew),
                        ]),
                    ]);
                };
            },
        };

        createApp(App).mount('#stage');

        /**
         * 顶边簇数（**仅参考，不是"行数"**）：把所有子孙元素的顶边按 10px 容差聚类。
         * `align-items: center` 下同一行里高度不同的元素顶边本来就不同，
         * 所以绝对值偏大，只能看**变化趋势**。判断几行请用 `头部高`。
         */
        const rowsOf = (el) => {
            const tops = [...el.querySelectorAll('*')]
                .filter(n => n.getBoundingClientRect().height > 0)
                .map(n => Math.round(n.getBoundingClientRect().top))
                .sort((a, b) => a - b);
            let rows = 0;
            let last = -Infinity;
            for (const t of tops) {
                if (t - last > 10) { rows += 1; last = t; }
            }
            return rows;
        };

        window.__measure = function (v, width) {
            const header = document.querySelector('.header-bar');
            const navEl = header.querySelector('.nav-zone') || header.querySelector('.hstack');
            const box = header.getBoundingClientRect();
            const crumbs = [...header.querySelectorAll('.crumb')];
            const cur = header.querySelector('.crumb-current');
            const curBox = cur ? cur.getBoundingClientRect() : null;
            const tbBox = header.querySelector('.toolbar').getBoundingClientRect();

            // 单条截断是否真的发生：文本层 scrollWidth > clientWidth
            const ellipsised = crumbs
                .map(c => c.querySelector('.crumb-text'))
                .filter(Boolean)
                .filter(t => t.scrollWidth > t.clientWidth + 1).length;

            // 「分隔符真的生成了吗」——直接问计算样式要 ::before 的 content
            const sep = document.querySelector('.nav-zone .crumb:not(.crumb-root)');
            const sepContent = sep ? getComputedStyle(sep, '::before').content : '(no nav-zone)';

            return {
                变体: v,
                窗口宽: width,
                头部高: Math.round(box.height),
                '顶边簇数(仅参考)': rowsOf(header),
                渲染出的段数: crumbs.length,
                有截断的段数: ellipsised,
                当前段可见: curBox ? (curBox.width > 0 && Math.round(curBox.right) <= Math.round(box.right) + 1) : null,
                工具条未溢出: Math.round(tbBox.right) <= Math.round(box.right) + 1,
                导航区宽: Math.round(navEl.getBoundingClientRect().width),
                头部宽: Math.round(box.width),
                '::before内容': sepContent,
            };
        };

        /**
         * 工具条预算明细：每个子元素真实占多宽 + gap 合计。
         * 用途：把"工具条是导航区不够的元凶"从判断变成数字，并算出
         * "缩某几个字的文案" / "把某几个动作收进下拉" 各自能还给导航区多少 px。
         */
        window.__measureToolbar = function () {
            const tb = document.querySelector('.toolbar');
            const box = tb.getBoundingClientRect();
            const kids = [...tb.children].map(el => ({
                类型: (el.className || '').toString().split(/\s+/)
                    .filter(c => c.startsWith('n-')).slice(0, 2).join('.') || el.tagName.toLowerCase(),
                文字: (el.textContent || '').trim().slice(0, 10),
                宽: Math.round(el.getBoundingClientRect().width),
            }));
            const cs = getComputedStyle(tb);
            const gap = Math.round(parseFloat(cs.columnGap || cs.gap) || 0);
            return {
                工具条总宽: Math.round(box.width),
                子元素数: tb.children.length,
                gap单值: gap,
                gap合计: gap * (tb.children.length - 1),
                子元素合计: kids.reduce((s, k) => s + k.宽, 0),
                明细: kids,
            };
        };

        /**
         * 四种工具条形态 × 两档"需要它让路"的窗口宽度。
         * 输出里直接给「导航区还剩多宽」—— 那就是"面包屑还有没有地方"的答案。
         */
        window.__measureToolbarPlans = async function () {
            const stage = document.getElementById('stage');
            window.__setVariant('new');
            const out = [];
            for (const m of TB_MODES) {
                window.__setToolbar(m);
                await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
                for (const w of [640, 800, 1280]) {
                    stage.style.width = w + 'px';
                    await new Promise(r => setTimeout(r, 80));
                    const header = document.querySelector('.header-bar');
                    const box = header.getBoundingClientRect();
                    out.push({
                        方案: m,
                        窗口宽: w,
                        工具条宽: Math.round(header.querySelector('.toolbar').getBoundingClientRect().width),
                        导航区宽: Math.round(header.querySelector('.nav-zone').getBoundingClientRect().width),
                        头部高: Math.round(box.height),
                        工具条未溢出: Math.round(header.querySelector('.toolbar').getBoundingClientRect().right) <= Math.round(box.right) + 1,
                    });
                }
            }
            window.__setToolbar('now');
            return out;
        };

        /**
         * 根 chip 三形态 × 三档宽度，**在"已批准"的工具条形态下**（更多收纳）测。
         * 输出里看两件事：`导航区宽`（面包屑有多少地方）与 `当前段可见`。
         */
        window.__measureChipForms = async function () {
            const stage = document.getElementById('stage');
            window.__setVariant('new');
            window.__setToolbar('more');
            const out = [];
            for (const f of ['path', 'label', 'icon']) {
                window.__setChipForm(f);
                await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
                for (const w of [640, 800, 1280]) {
                    stage.style.width = w + 'px';
                    await new Promise(r => setTimeout(r, 80));
                    const header = document.querySelector('.header-bar');
                    const box = header.getBoundingClientRect();
                    const cur = header.querySelector('.crumb-current');
                    out.push({
                        chip形态: f,
                        窗口宽: w,
                        芯片宽: Math.round(header.querySelector('.nav-zone > *').getBoundingClientRect().width),
                        导航区宽: Math.round(header.querySelector('.nav-zone').getBoundingClientRect().width),
                        头部高: Math.round(box.height),
                        当前段可见: cur ? Math.round(cur.getBoundingClientRect().right) <= Math.round(box.right) + 1 : null,
                    });
                }
            }
            window.__setChipForm('path');
            window.__setToolbar('now');
            return out;
        };

        window.__probeAll = async function () {
            const out = [];
            const stage = document.getElementById('stage');
            for (const v of ['old', 'new']) {
                // ⚠️ 口径要对齐"改造前 vs 已落地"：
                //   old = 改造前的完整形态（flex-wrap 换行 + 三个平铺按钮）
                //   new = 已批准并落地的形态（nowrap 分区 + 三个动作收进「更多」）
                // 第一版两边都用 'now' 工具条 ⇒ 对照表里 new 也带着"溢出"那个旧毛病，
                // 判据把它报成 ❌ —— 那是口径错，不是实现错。
                window.__setToolbar(v === 'old' ? 'now' : 'more');
                for (const w of [640, 800, 1280, 1920]) {
                    window.__setVariant(v);
                    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
                    stage.style.width = w + 'px';
                    await new Promise(r => setTimeout(r, 80));
                    out.push(window.__measure(v, w));
                }
            }
            window.__setToolbar('now');
            return out;
        };
    </script>
</body>

</html>

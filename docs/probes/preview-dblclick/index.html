<!doctype html>
<html lang="zh">

<head>
    <meta charset="utf-8">
    <title>probe: 预览图 双击无行为 + 滚轮缩放</title>
    <style>
        /* 模拟网格那张卡片（生产里双击它= 开视频 / 进文件夹） */
        .image-box-item {
            /* 必须**铺满视口**：A/B 对照那步要在"预览图正下方"找这张卡片，
               卡片太小就落在双击点之外，elementsFromPoint 找不到 ⇒ 对照失效。 */
            position: fixed;
            inset: 0;
            z-index: -1;
            background: #334;
            color: #fff;
            font: 12px sans-serif;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #cfd8e3;
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
</body>

</html>
